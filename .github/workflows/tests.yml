name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP style
        run: composer style:check

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10'
            testbench: '8'
            security_flag: '--no-security-blocking'
          - php: '8.2'
            laravel: '11'
            testbench: '9'
            security_flag: '--no-security-blocking'
          - php: '8.2'
            laravel: '12'
            testbench: '10'
            security_flag: ''
          - php: '8.3'
            laravel: '13'
            testbench: '11'
            security_flag: ''
          - php: '8.4'
            laravel: '13'
            testbench: '11'
            security_flag: ''

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml
          coverage: none
          tools: composer:v2

      - name: Install Laravel ${{ matrix.laravel }} test dependencies
        # Historical Laravel versions have advisories; bypass blocking only in those test jobs.
        run: composer require --dev "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --with-all-dependencies ${{ matrix.security_flag }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

  required-tests:
    name: Package tests
    needs: [phpunit, style]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test matrix
        run: test '${{ needs.phpunit.result }}' = 'success' && test '${{ needs.style.result }}' = 'success'
